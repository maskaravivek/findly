[build]
builder = "RAILPACK"
buildCommand = "pnpm install --frozen-lockfile && pnpm build"
watchPatterns = ["apps/api/**", "packages/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.base.json"]

[deploy]
startCommand = "pnpm --filter @findly/api start"
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
